name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull and push multi-arch images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USER }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push multi-arch images
        shell: bash
        run: |
          set -euo pipefail

          declare -A duplicate_images=()
          declare -A image_namespaces=()

          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "${line//[[:space:]]/}" || "$line" =~ ^[[:space:]]*# ]] && continue
            image="$(awk '{print $NF}' <<< "$line")"
            image="${image%%@*}"
            image_name_tag="${image##*/}"
            image_name="${image_name_tag%%:*}"

            if [[ "$image" == */*/* ]]; then
              namespace="${image#*/}"
              namespace="${namespace%%/*}"
            elif [[ "$image" == */* ]]; then
              namespace="${image%%/*}"
            else
              namespace=""
            fi

            if [[ -n "${image_namespaces[$image_name]+x}" && "${image_namespaces[$image_name]}" != "$namespace" ]]; then
              duplicate_images[$image_name]=true
            else
              image_namespaces[$image_name]="$namespace"
            fi
          done < images.txt

          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "${line//[[:space:]]/}" || "$line" =~ ^[[:space:]]*# ]] && continue

            platforms="$(sed -nE 's/.*--platform(=|[[:space:]])([^[:space:]]+).*/\2/p' <<< "$line")"
            platforms="${platforms:-linux/amd64,linux/arm64}"

            image="$(awk '{print $NF}' <<< "$line")"
            image="${image%%@*}"
            image_name_tag="${image##*/}"
            image_name="${image_name_tag%%:*}"

            namespace_prefix=""
            if [[ -n "${duplicate_images[$image_name]+x}" ]]; then
              if [[ "$image" == */* ]]; then
                namespace="${image%%/*}"
                [[ "$image" == */*/* ]] && namespace="${image#*/}" && namespace="${namespace%%/*}"
                namespace_prefix="${namespace}_"
              fi
            fi

            target="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$namespace_prefix$image_name_tag"
            echo "Mirroring $image to $target for platforms: $platforms"

            docker buildx build \
              --platform "$platforms" \
              --tag "$target" \
              --push \
              --file - . <<'DOCKERFILE'
FROM $image
DOCKERFILE

          done < images.txt
